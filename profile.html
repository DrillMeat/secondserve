<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - PharmaT Audit</title>
  <link rel="stylesheet" href="audit-styles.css">
  <style>
    .profile-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    
    .profile-header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: var(--card-shadow);
      margin-bottom: 30px;
      text-align: center;
    }
    
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 48px;
      color: white;
      font-weight: bold;
    }
    
    .profile-form {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: var(--card-shadow);
    }
    
    .form-section {
      margin-bottom: 30px;
    }
    
    .form-section h3 {
      color: var(--secondary-color);
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
    }
    
    .form-group label {
      color: #333;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    
    .save-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .save-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    
    .back-link {
      display: inline-block;
      color: var(--primary-color);
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: 500;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">JD</div>
      <h1>Complete Your Profile</h1>
      <p>Please fill in your information to get the most out of PharmaT Audit</p>
    </div>
    
    <form class="profile-form" id="profileForm">
      <div class="form-section">
        <h3>Personal Information</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h3>Professional Information</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="jobTitle">Job Title *</label>
            <input type="text" id="jobTitle" name="jobTitle" required>
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department">
              <option value="">Select Department</option>
              <option value="quality_assurance">Quality Assurance</option>
              <option value="regulatory_affairs">Regulatory Affairs</option>
              <option value="compliance">Compliance</option>
              <option value="manufacturing">Manufacturing</option>
              <option value="distribution">Distribution</option>
              <option value="pharmacy">Pharmacy</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="company">Company/Organization *</label>
            <input type="text" id="company" name="company" required>
          </div>
          <div class="form-group">
            <label for="experience">Years of Experience</label>
            <select id="experience" name="experience">
              <option value="">Select Experience</option>
              <option value="0-2">0-2 years</option>
              <option value="3-5">3-5 years</option>
              <option value="6-10">6-10 years</option>
              <option value="11-15">11-15 years</option>
              <option value="16+">16+ years</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h3>Certifications & Qualifications</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="certifications">Professional Certifications</label>
            <textarea id="certifications" name="certifications" 
                     placeholder="List your relevant certifications (e.g., GMP, GDP, ISO certifications)"></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="education">Education Background</label>
            <input type="text" id="education" name="education" 
                   placeholder="Degree, Institution, Year">
          </div>
          <div class="form-group">
            <label for="specialization">Area of Specialization</label>
            <select id="specialization" name="specialization">
              <option value="">Select Specialization</option>
              <option value="gmp">Good Manufacturing Practice (GMP)</option>
              <option value="gdp">Good Distribution Practice (GDP)</option>
              <option value="gcp">Good Clinical Practice (GCP)</option>
              <option value="pharmacovigilance">Pharmacovigilance</option>
              <option value="regulatory_compliance">Regulatory Compliance</option>
              <option value="quality_control">Quality Control</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h3>Preferences</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="timezone">Timezone</label>
            <select id="timezone" name="timezone">
              <option value="UTC">UTC</option>
              <option value="EST">Eastern Time (EST)</option>
              <option value="CST">Central Time (CST)</option>
              <option value="MST">Mountain Time (MST)</option>
              <option value="PST">Pacific Time (PST)</option>
              <option value="GMT">Greenwich Mean Time (GMT)</option>
              <option value="CET">Central European Time (CET)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="notifications">Email Notifications</label>
            <select id="notifications" name="notifications">
              <option value="all">All notifications</option>
              <option value="important">Important only</option>
              <option value="none">None</option>
            </select>
          </div>
        </div>
      </div>
      
      <button type="submit" class="save-btn">Save Profile</button>
    </form>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Update avatar initials when name changes
      const firstNameInput = document.getElementById('firstName');
      const lastNameInput = document.getElementById('lastName');
      const profileAvatar = document.getElementById('profileAvatar');
      
      function updateAvatar() {
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const initials = (firstName.charAt(0) + lastName.charAt(0)).toUpperCase();
        profileAvatar.textContent = initials || 'JD';
      }
      
      firstNameInput.addEventListener('input', updateAvatar);
      lastNameInput.addEventListener('input', updateAvatar);
      
      // Handle form submission
      document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Collect form data
        const formData = new FormData(this);
        const profileData = Object.fromEntries(formData);
        
        // Validate required fields
        const requiredFields = ['firstName', 'lastName', 'email', 'jobTitle', 'company'];
        const missingFields = requiredFields.filter(field => !profileData[field]);
        
        if (missingFields.length > 0) {
          alert(`Please fill in the following required fields: ${missingFields.join(', ')}`);
          return;
        }
        
        // Save profile data (in a real app, this would be sent to a server)
        localStorage.setItem('pharmat_profile', JSON.stringify(profileData));
        
        alert('Profile saved successfully!');
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
